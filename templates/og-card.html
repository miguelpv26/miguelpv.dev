<!doctype html>
<!-- Social card (1200×630) rendered by scripts/og-cards.js. Not deployed. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: JBM; src: url(/assets/fonts/jetbrains-mono-v24-latin-regular.woff2) format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: JBM; src: url(/assets/fonts/jetbrains-mono-v24-latin-500.woff2) format('woff2'); font-weight: 500; font-display: block; }
@font-face { font-family: JBM; src: url(/assets/fonts/jetbrains-mono-v24-latin-600.woff2) format('woff2'); font-weight: 600; font-display: block; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: JBM, monospace; color: #fff;
  background:
    radial-gradient(900px 520px at 100% 0%, rgba(22,198,12,.30), transparent 60%),
    linear-gradient(135deg, #0b0b0b 0%, #0d0d0d 55%, #0a120a 100%);
  position: relative;
}
body::before { /* faint grid, like the original card */
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 40px 40px;
}
.card { position: absolute; inset: 0; padding: 72px 82px 64px; display: flex; flex-direction: column; }
.eyebrow { display: flex; align-items: center; gap: 16px; font-size: 21px; letter-spacing: .2em; text-transform: uppercase; color: #d6d6d6; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #16c60c; box-shadow: 0 0 12px #16c60c; flex: none; }
h1 { margin-top: 26px; font-weight: 500; letter-spacing: -.01em; line-height: 1.08; font-size: var(--title, 88px); max-width: 1040px; }
h1 .end { color: #16c60c; text-shadow: 0 0 14px rgba(22,198,12,.8); }
.sub { margin-top: 24px; margin-bottom: 28px; font-size: 31px; line-height: 1.42; color: #9a9a9a; max-width: 1030px; }
.chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 16px; }
.chip { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border: 1px solid rgba(255,255,255,.13); border-radius: 10px; background: rgba(255,255,255,.04); font-size: 23px; font-weight: 500; color: #eee; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #16c60c); box-shadow: 0 0 8px var(--c, #16c60c); }
.foot { margin-top: 38px; display: flex; align-items: center; justify-content: space-between; font-size: 23px; }
.foot b { font-weight: 600; }
.foot span { color: #8a8a8a; }
.pill { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border: 1.5px solid rgba(22,198,12,.55); border-radius: 999px; background: rgba(22,198,12,.07); color: #16c60c; font-size: 20px; font-weight: 600; letter-spacing: .14em; }
.pill.ligs { letter-spacing: 0; font-variant-ligatures: normal; }
</style></head>
<body>
<div class="card">
  <div class="eyebrow"><span class="dot"></span><span id="eyebrow"></span></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="chips" id="chips"></div>
  <div class="foot"><div><b>miguelpv.dev</b> <span id="footer"></span></div><div class="pill" id="pill"><span class="dot" style="width:9px;height:9px"></span><span id="pilltext"></span></div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const COLORS = { Vue: '#41b883', Node: '#5fa04e', TypeScript: '#3178c6', MongoDB: '#47a248', React: '#61dafb', Tailwind: '#38bdf8', JavaScript: '#f7df1e', HTML: '#e34f26', CSS: '#2965f1', npm: '#cb3837' };
document.getElementById('eyebrow').textContent = q.get('eyebrow');
const t = document.getElementById('title');
t.textContent = q.get('title');
const end = document.createElement('span'); end.className = 'end'; end.textContent = '.'; t.append(end);
if (q.get('size')) document.body.style.setProperty('--title', q.get('size') + 'px');
document.getElementById('sub').textContent = q.get('sub');
document.getElementById('footer').textContent = '· ' + q.get('footer');
for (const c of (q.get('chips') || '').split('|').filter(Boolean)) {
  const el = document.createElement('span'); el.className = 'chip';
  const i = document.createElement('i'); if (COLORS[c]) i.style.setProperty('--c', COLORS[c]);
  el.append(i, c); document.getElementById('chips').append(el);
}
const pill = q.get('pill');
if (pill) { document.getElementById('pilltext').textContent = pill; if (pill.includes('->')) document.getElementById('pill').classList.add('ligs'); }
else document.getElementById('pill').remove();
</script>
</body></html>
