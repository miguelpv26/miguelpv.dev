<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#16c60c" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" href="/assets/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="shortcut icon" href="/assets/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />

    <title>404 — Page not found | Miguel Payá Vañó</title>

    <style id="inline-css"></style>
  </head>

  <body class="error-body">
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>

    <main id="main" class="terminal">
      <div class="terminal__bar">
        <span class="terminal__prompt">user@system: ~</span>
        <span class="terminal__controls" aria-hidden="true">
          <span class="terminal__control terminal__control--min"></span>
          <span class="terminal__control terminal__control--max"></span>
          <span class="terminal__control terminal__control--close"></span>
        </span>
      </div>

      <div class="terminal__body">
        <p class="error-page__code">404</p>
        <h1 class="error-page__title">Page not found</h1>
        <p class="error-page__text">The page you're looking for doesn't exist.</p>
        <div class="error-page__actions">
          <a class="btn" href="/en/">Go to homepage</a>
        </div>
      </div>
    </main>

    <script src="/assets/min/main.min.js" defer></script>
  </body>
</html>
